<!doctype html>
<html lang="en"><head><base target="_blank"><meta charset="utf-8"><title>AI Daily News Digest</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#f5f5f5;background:#383838}
*{box-sizing:border-box}body{margin:0;background:#383838;overflow-wrap:break-word}.shell{max-width:600px;margin:0 auto;background:#1c1c1c;background-image:linear-gradient(to bottom,#2c2c2e 0px,#232324 70px,#1c1c1c 160px);background-repeat:no-repeat}
header{padding:32px 40px 22px}.eyebrow{display:none}h1{font-size:30px;line-height:1.08;font-weight:750;letter-spacing:-.5px;margin:0}h1 span{display:block}#status{font-size:12px;line-height:1.4;color:#a0a0a0;margin-bottom:8px}#subject{font-size:14px;line-height:1.4;font-weight:400;color:#a0a0a0;margin:0 40px 18px}
.tools{max-width:600px;margin:0 auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:14px 20px;background:#383838;font-size:12px;color:#b0b0b0}button,select{font:inherit;border:1px solid #666;border-radius:5px;background:#2c2c2c;color:#f5f5f5;padding:8px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.notice{margin:0 40px 22px;background:#303030;border-left:3px solid #a0a0a0;padding:12px;color:#d0d0d0;font-size:14px;line-height:1.5}.intro{font-family:ui-serif,'New York',Charter,Georgia,'Times New Roman',serif;font-size:18px;line-height:1.45;color:#b0b0b0;margin:0;padding:0 40px 24px}
.section{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:1.5px;text-transform:uppercase;color:#f5f5f5;border-top:2px solid #999;border-bottom:1px solid #484848;margin:0 40px;padding:10px 0 9px}.section.top{color:#ff375f}
.story{margin:0 40px;padding:14px 0 18px;border-bottom:1px solid #484848}.story h3{font-family:ui-serif,'New York',Charter,Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;line-height:1.2;margin:0}.story h3 a{color:inherit;text-decoration:none}.summary{font-size:16px;line-height:1.5;color:#b0b0b0;margin:7px 0 0}.links{font-size:14px;line-height:1.4;margin-top:5px;color:#a0a0a0}.links a{color:#a0a0a0;text-decoration:underline;margin-right:8px;display:inline-block}
.story.top{position:relative;border-bottom:0;padding:12px 0 10px 16px}.story.top::before{content:'•';position:absolute;left:0;top:11px;font-size:19px}.story.top h3{display:inline;font-size:21px}.story.top .summary{display:inline;font-family:ui-serif,'New York',Charter,Georgia,'Times New Roman',serif;font-size:19px;line-height:1.4}.story.top .summary::before{content:' — '}
footer{background:#2c2c2c;color:#b0b0b0;padding:24px 40px 30px;font-size:12px;line-height:1.5;margin-top:0}[hidden]{display:none!important}@media(max-width:480px){header{padding-left:22px;padding-right:22px}h1{font-size:26px}.section{font-size:19px;margin-left:22px;margin-right:22px}.story,.notice{margin-left:22px;margin-right:22px}.intro{padding-left:22px;padding-right:22px}#subject{margin-left:22px;margin-right:22px}footer{padding-left:22px;padding-right:22px}}
</style></head><body>
<div class="tools"><label for="editions">Saved editions</label><select id="editions" aria-label="Saved editions" disabled></select><button id="refresh" type="button">Refresh</button></div>
<main class="shell"><header><div id="status" role="status">Loading your digest…</div><h1>Good Morning<span>From AI Daily News Digest</span></h1></header>
<div id="notice" class="notice" hidden></div><h2 id="subject"></h2><section id="content"></section>
<footer>Picked and summarized by AI from the day’s feeds. Tap a headline to read the full story.<br>AI summaries may contain errors. Edition dates use America/Chicago.</footer></main>
<script>
'use strict';
const el = id => document.getElementById(id);
function add(parent, tag, text, className) { const node = document.createElement(tag); node.textContent = text; if(className) node.className = className; parent.appendChild(node); return node; }
function renderText(text) {
  const content = el('content'); content.replaceChildren(); let story = null; let top = false;
  text.split(/\r?\n/).slice(1).forEach(line => {
    if(!line.trim()) return;
    if(/^== .+ ==$/.test(line)) { top=line.slice(3,-3)==='Top stories'; add(content,'h2',line.slice(3,-3),top?'section top':'section'); story=null; }
    else if(line.startsWith('* ')) { story=add(content,'article','',top?'story top':'story'); add(story,'h3',line.slice(2)); }
    else if(line.startsWith('TL;DR: ')) add(content,'p',line.slice(7),'intro');
    else {
      const link = /^\s+(.+?):\s+(https?:\/\/\S+)\s*$/.exec(line);
      if(story && link) {
        let url; try { url=new URL(link[2]); } catch(_) { return; }
        if(url.protocol!=='https:' && url.protocol!=='http:') return;
        let links=story.querySelector('.links'); if(!links) links=add(story,'div','','links'); const a=add(links,'a',link[1]); a.href=url.href; a.target='_blank'; a.rel='noopener noreferrer';
        const heading=story.querySelector('h3'); if(heading && !heading.querySelector('a')) { const title=heading.textContent; heading.textContent=''; const headline=add(heading,'a',title); headline.href=url.href; headline.target='_blank'; headline.rel='noopener noreferrer'; }
      } else add(story||content,'p',line.trim(),story?'summary':'intro');
    }
  });
}
function render(data) {
  el('subject').textContent=data.edition.subject;
  el('status').textContent='Edition: '+data.edition.date+' · '+(data.edition.quality==='full'?'Full AI summaries':data.edition.quality==='raw_headlines'?'Headlines only':'Limited or partial AI summaries');
  const messages=[];
  if(data.stale) messages.push('This is an older edition. Today’s saved digest is not being shown.');
  if(data.cached) messages.push('Showing a cached copy because the latest saved editions could not be checked.');
  else if(data.fallback) messages.push('The newest saved edition could not be opened. Showing a previous edition.');
  if(data.edition.quality!=='full') messages.push('Some full AI summaries are unavailable in this edition.');
  el('notice').textContent=messages.join(' '); el('notice').hidden=!messages.length;
  el('editions').replaceChildren();
  data.editions.forEach(edition=>{const option=add(el('editions'),'option',edition.label);option.value=edition.id;option.selected=edition.id===data.edition.id;});
  renderText(data.edition.text);
}
function load(id) {
  el('refresh').disabled=true; el('editions').disabled=true;
  google.script.run.withSuccessHandler(data=>{render(data);el('refresh').disabled=false;el('editions').disabled=false;})
    .withFailureHandler(()=>{if(!el('subject').textContent) el('status').textContent='Reader unavailable';el('notice').hidden=false;el('notice').textContent='Your digest could not be refreshed. Try again later, or check the reader setup.';el('refresh').disabled=false;el('editions').disabled=false;})
    .getReaderData(id||null);
}
el('refresh').addEventListener('click',()=>load());el('editions').addEventListener('change',()=>load(el('editions').value));load();
</script></body></html>
