name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Run mocked Google monitor tests
        run: node tests/test_google_apps_script.cjs
      - name: Check Google monitor syntax and manifest
        run: |
          node --check < monitoring/google_apps_script.gs
          python -m json.tool monitoring/appsscript.json > /dev/null
