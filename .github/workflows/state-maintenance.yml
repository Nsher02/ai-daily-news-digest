name: Encrypt legacy delivery state (no email)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
# Share the delivery lock so migration cannot race a normal send.
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install encryption dependency
        run: python -m pip install cryptography==50.0.2
      - name: Encrypt and verify migration snapshot
        run: python state_maintenance.py migrate
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_STATE_KEY: ${{ secrets.DIGEST_STATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-state-encrypted-migrated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-artifacts/migration/state/state.enc
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-legacy-encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-artifacts/migration/backup/legacy-backup.enc
          if-no-files-found: error
          retention-days: 7
