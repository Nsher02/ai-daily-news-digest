name: "AI Daily News Digest"
run-name: "AI Daily News Digest (${{ github.event_name == 'schedule' && 'github-cron' || inputs.trigger }})"

on:
  # Main schedule: cron-job.org dispatches with trigger=external-schedule at 7:50 AM Chicago.
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual always sends; external-schedule obeys the send window"
        type: choice
        options: [manual, external-schedule]
        default: manual
  # Backup: GitHub's cron is unreliable. Plain UTC (no `timezone:`); 12-14 UTC covers
  # 7:53 AM Chicago in both CST (UTC-6) and CDT (UTC-5). The window check drops extras.
  schedule:
    - cron: "53 12,13,14 * * *"
    - cron: "23 12,13,14 * * *"

permissions:
  actions: read
  contents: read

# A run that starts while another is going waits for it, then its window check sees the receipt and skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Scheduled runs (external or GitHub cron) send once, the first time one lands
      # between 7:45 and 10:00 AM Chicago. Plain manual runs always send.
      - name: Check send window
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ inputs.trigger }}
        run: python3 send_window.py

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send digest
        id: build
        if: steps.guard.outputs.skip != 'true'
        run: python digest.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      # A successful named step is the durable receipt read by later runs' window check.
      - name: "SMTP accepted: ${{ steps.build.outputs.digest_date }}"
        if: steps.build.outputs.outcome == 'sent'
        run: echo "SMTP accepted the digest. This does not prove inbox delivery."

      - name: Email failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["Subject"] = "AI Daily News Digest failed – check GitHub Actions"
          msg["From"] = os.environ.get("EMAIL_FROM") or os.environ["SMTP_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(f"Today's digest run failed. Logs: {os.environ['RUN_URL']}")
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ.get("SMTP_PORT") or 587), timeout=30) as smtp:
              smtp.starttls(context=ssl.create_default_context())
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(msg)
          EOF
