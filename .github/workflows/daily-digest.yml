name: "AI Daily News Digest"

on:
  schedule:
    # Plain UTC crons (no `timezone:`). 12-14 UTC covers 7:53 AM Chicago in both CST
    # (UTC-6) and CDT (UTC-5); the "Check send window" step drops the extra firings.
    - cron: "53 12,13,14 * * *"
    - cron: "23 12,13,14 * * *"
    - cron: "42 18 * * *" # TEMPORARY: proves the scheduler fires; remove after one run
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A delayed run waits for the previous one, then its window check sees the receipt and skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  scheduler-test:
    if: github.event.schedule == '42 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TEST: scheduler fired"'

  digest:
    if: github.event.schedule != '42 18 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Scheduled runs send once, the first time one lands between 7:45 and 10:00 AM Chicago.
      - name: Check send window
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 send_window.py

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send digest
        id: build
        if: steps.guard.outputs.skip != 'true'
        run: python digest.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      # A successful named step is the durable receipt read by later runs' window check.
      - name: "SMTP accepted: ${{ steps.build.outputs.digest_date }}"
        if: steps.build.outputs.outcome == 'sent'
        run: echo "SMTP accepted the digest. This does not prove inbox delivery."

      - name: Email failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["Subject"] = "AI Daily News Digest failed – check GitHub Actions"
          msg["From"] = os.environ.get("EMAIL_FROM") or os.environ["SMTP_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(f"Today's digest run failed. Logs: {os.environ['RUN_URL']}")
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ.get("SMTP_PORT") or 587), timeout=30) as smtp:
              smtp.starttls(context=ssl.create_default_context())
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(msg)
          EOF
