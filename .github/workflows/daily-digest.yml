name: "AI Daily News Digest"

on:
  schedule:
    # Off the top of the hour, when GitHub drops or delays scheduled runs.
    - cron: "53 7 * * *" # primary: 7:53 AM Central, DST handled by GitHub
      timezone: "America/Chicago"
    - cron: "23 8 * * *" # backup: 8:23 AM Central, skipped if the primary already succeeded
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# If the primary run is delayed into the backup slot, the backup waits and then skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if today's digest already went out
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=America/Chicago date +%F)
          since=$(TZ=America/Chicago date -d 'yesterday' +%F)
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/daily-digest.yml/runs?created=%3E%3D$since&per_page=100" --jq '.workflow_runs[].id')
          for run_id in $runs; do
            markers=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              --jq '.jobs[].steps[]? | select(.conclusion == "success") | .name')
            if printf '%s\n' "$markers" | grep -Fxq "SMTP accepted: $today"; then
              echo "Today's digest was accepted by SMTP; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Digest skipped: SMTP already accepted today's digest." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No SMTP-accepted marker today ($today); continuing."

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send digest
        id: build
        if: steps.guard.outputs.skip != 'true'
        run: python digest.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      # A successful named step is the durable receipt read by the next scheduled run.
      - name: "SMTP accepted: ${{ steps.build.outputs.digest_date }}"
        if: steps.build.outputs.outcome == 'sent'
        run: echo "SMTP accepted the digest. This does not prove inbox delivery."
