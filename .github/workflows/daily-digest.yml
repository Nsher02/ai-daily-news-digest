name: "AI Daily News Digest"
run-name: "AI Daily News Digest (${{ github.event_name == 'schedule' && 'github-cron' || inputs.trigger }})"

on:
  # Main schedule: cron-job.org dispatches with trigger=external-schedule at 7:50 AM Chicago.
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual always sends; external-schedule obeys the send window"
        type: choice
        options: [manual, external-schedule]
        default: manual
  # Backup: GitHub's cron is unreliable. Plain UTC (no `timezone:`); 12-14 UTC covers
  # 7:53 AM Chicago in both CST (UTC-6) and CDT (UTC-5). The window check drops extras.
  schedule:
    - cron: "53 12,13,14 * * *"
    - cron: "23 12,13,14 * * *"

permissions:
  actions: read
  contents: read

# A run that starts while another is going waits for it, then its window check sees the receipt and skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIGGER: ${{ inputs.trigger }}
      DIGEST_HISTORY_PATH: .digest-state/history.json
      DIGEST_PREPARED_PATH: .digest-state/prepared.json
      DIGEST_QUALITY_PATH: .digest-state/quality.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Scheduled runs (external or GitHub cron) send once, the first time one lands
      # between 7:45 and 10:00 AM Chicago. Plain manual runs always send.
      - name: Check send window
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ inputs.trigger }}
        run: python3 send_window.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore digest state
        if: steps.guard.outputs.skip != 'true'
        run: python restore_state.py
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_STATE_KEY: ${{ secrets.DIGEST_STATE_KEY }}

      - name: Prepare digest
        id: prepare
        if: steps.guard.outputs.skip != 'true'
        run: python digest.py --prepare-only
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      # Persist the reserved edition before SMTP. Another attempt treats an unfinished
      # reservation as ambiguous instead of sending a potentially duplicate edition.
      - name: Encrypt prepared state
        id: seal_prepared
        if: steps.prepare.outputs.outcome == 'prepared'
        run: python state_crypto.py --output .digest-artifacts/prepared/state.enc
        env:
          DIGEST_STATE_KEY: ${{ secrets.DIGEST_STATE_KEY }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.outcome == 'prepared' && steps.seal_prepared.outcome == 'success'
        with:
          name: digest-state-encrypted-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-artifacts/prepared/state.enc
          if-no-files-found: error
          retention-days: 7

      - name: Send prepared digest
        id: build
        if: steps.prepare.outputs.outcome == 'prepared' && steps.seal_prepared.outcome == 'success'
        run: python digest.py --send-prepared
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      - name: Encrypt final state
        id: seal_final
        if: always() && steps.prepare.outputs.outcome == 'prepared'
        run: python state_crypto.py --output .digest-artifacts/final/state.enc
        env:
          DIGEST_STATE_KEY: ${{ secrets.DIGEST_STATE_KEY }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.seal_final.outcome == 'success'
        with:
          name: digest-state-encrypted-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: .digest-artifacts/final/state.enc
          if-no-files-found: error
          retention-days: 7

      # A successful named step is the durable receipt read by later runs' window check.
      - name: "SMTP accepted: ${{ steps.build.outputs.digest_date }}"
        if: always() && steps.build.outputs.outcome == 'sent'
        run: echo "SMTP accepted the digest. This does not prove inbox delivery."

      - name: Email failure alert
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["Subject"] = "AI Daily News Digest failed – check GitHub Actions"
          msg["From"] = os.environ.get("EMAIL_FROM") or os.environ["SMTP_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(f"Today's digest run failed. Logs: {os.environ['RUN_URL']}")
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ.get("SMTP_PORT") or 587), timeout=30) as smtp:
              smtp.starttls(context=ssl.create_default_context())
              smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(msg)
          EOF
